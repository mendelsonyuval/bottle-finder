fa3-fa23a198c113\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n  <script src=\"296c09ac-2bc6-4346-8151-206708585a70\"><\u002Fscript>\n\n  <style>\n    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\n\n    :root {\n      --bg:       #F7F4F0;\n      --bg-card:  #FFFFFF;\n      --ink:      #17130F;\n      --ink-2:    #5C534A;\n      --ink-3:    #A39890;\n      --border:   #E4DDD6;\n      --amber:    #C47A2E;\n      --amber-lt: #FBF3E8;\n      --amber-dk: #9E601E;\n      --radius:   14px;\n      --radius-lg: 20px;\n    }\n\n    html { scroll-behavior: smooth; }\n    body {\n      font-family: 'Inter', sans-serif;\n      background: var(--bg);\n      color: var(--ink);\n      -webkit-font-smoothing: antialiased;\n      line-height: 1.6;\n    }\n\n    /* ── UTILS ── */\n    .label {\n      font-size: 10px;\n      font-weight: 700;\n      letter-spacing: 0.14em;\n      text-transform: uppercase;\n      color: var(--ink-3);\n    }\n    .rule { border: none; border-top: 1px solid var(--border); }\n\n    /* ── NAV ── */\n    .nav {\n      position: sticky; top: 0; z-index: 100;\n      background: rgba(247,244,240,0.92);\n      backdrop-filter: blur(12px);\n      border-bottom: 1px solid var(--border);\n    }\n    .nav-inner {\n      max-width: 1200px; margin: 0 auto;\n      padding: 0 32px;\n      height: 64px;\n      display: flex; align-items: center; justify-content: space-between;\n    }\n    .nav-logo {\n      display: flex; align-items: center; gap: 10px;\n      font-size: 17px; font-weight: 800; color: var(--ink);\n      letter-spacing: -0.03em; text-decoration: none;\n    }\n    .nav-logo-mark { display:flex; align-items:center; }\n    .btn {\n      display: inline-flex; align-items: center; gap: 8px;\n      font-family: inherit; font-size: 14px; font-weight: 600;\n      border: none; cursor: pointer; text-decoration: none;\n      transition: all 0.15s ease;\n      white-space: nowrap;\n    }\n    .btn-dark {\n      background: var(--ink); color: var(--bg);\n      padding: 10px 20px; border-radius: 100px;\n    }\n    .btn-dark:hover { background: #2E2720; transform: translateY(-1px); }\n    .btn-dark:disabled { background: var(--border); cursor: not-allowed; transform: none; }\n    .btn-ghost {\n      background: transparent; color: var(--ink-2);\n      border: 1.5px solid var(--border);\n      padding: 10px 18px; border-radius: 100px;\n    }\n    .btn-ghost:hover { border-color: var(--ink-3); background: #fff; }\n    .btn-amber {\n      background: var(--amber); color: #fff;\n      padding: 14px 28px; border-radius: 100px;\n      font-size: 15px;\n    }\n    .btn-amber:hover { background: var(--amber-dk); transform: translateY(-1px); }\n    .btn-amber:disabled { background: var(--border); cursor: not-allowed; transform: none; }\n\n    /* ── HERO ── */\n    #hero {\n      max-width: 1200px; margin: 0 auto;\n      padding: 80px 32px 100px;\n    }\n    .hero-grid {\n      display: grid;\n      grid-template-columns: 1fr 380px;\n      gap: 64px;\n      align-items: start;\n    }\n    .hero-eyebrow {\n      display: flex; align-items: center; gap: 10px;\n      margin-bottom: 28px;\n    }\n    .hero-dot {\n      width: 8px; height: 8px;\n      background: var(--amber); border-radius: 50%;\n    }\n    .hero-h1 {\n      font-size: clamp(44px, 5.5vw, 76px);\n      font-weight: 900;\n      line-height: 1.0;\n      letter-spacing: -0.04em;\n      color: var(--ink);\n      margin-bottom: 28px;\n    }\n    .hero-h1 em {\n      font-style: normal;\n      color: var(--amber);\n    }\n    .hero-sub {\n      font-size: 17px;\n      color: var(--ink-2);\n      max-width: 420px;\n      line-height: 1.65;\n      margin-bottom: 40px;\n    }\n    .hero-meta {\n      display: flex; align-items: center; gap: 6px;\n      font-size: 13px; color: var(--ink-3);\n      margin-top: 16px;\n    }\n    .hero-meta-sep { color: var(--border); }\n\n    /* Hero right panel */\n    .hero-panel {\n      background: var(--bg-card);\n      border: 1px solid var(--border);\n      border-radius: var(--radius-lg);\n      overflow: hidden;\n    }\n    .hero-panel-header {\n      padding: 24px 24px 20px;\n      border-bottom: 1px solid var(--border);\n    }\n    .hero-stat-row {\n      display: flex;\n      border-bottom: 1px solid var(--border);\n    }\n    .hero-stat-row:last-child { border-bottom: none; }\n    .hero-stat {\n      flex: 1;\n      padding: 20px 24px;\n      border-right: 1px solid var(--border);\n    }\n    .hero-stat:last-child { border-right: none; }\n    .hero-stat-num {\n      font-size: 28px; font-weight: 900;\n      letter-spacing: -0.04em; color: var(--ink);\n      line-height: 1;\n      margin-bottom: 4px;\n    }\n    .hero-stat-label {\n      font-size: 11px; font-weight: 600;\n      color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.1em;\n    }\n    .hero-brands {\n      padding: 20px 24px;\n      display: flex; flex-wrap: wrap; gap: 6px;\n    }\n    .hero-brand-chip {\n      font-size: 12px; font-weight: 600;\n      color: var(--ink-2);\n      background: var(--bg);\n      border: 1px solid var(--border);\n      padding: 5px 10px; border-radius: 100px;\n    }\n\n    /* ── WIZARD (QUIZ) ── */\n    #wizard-section {\n      display: none;\n      min-height: calc(100vh - 64px);\n      background: var(--bg-card);\n      border-top: 1px solid var(--border);\n    }\n    .wizard-inner {\n      max-width: 760px; margin: 0 auto;\n      padding: 60px 32px 80px;\n    }\n    .wizard-progress-bar-track {\n      height: 2px; background: var(--border);\n      border-radius: 2px; overflow: hidden;\n      margin-bottom: 56px;\n    }\n    .wizard-progress-bar-fill {\n      height: 100%; background: var(--amber);\n      border-radius: 2px;\n      transition: width 0.4s ease;\n    }\n    .wizard-step-meta {\n      display: flex; align-items: center; justify-content: space-between;\n      margin-bottom: 8px;\n    }\n    .wizard-q-num {\n      font-size: 72px; font-weight: 900;\n      color: var(--border);\n      line-height: 1;\n      letter-spacing: -0.04em;\n      margin-bottom: -8px;\n      display: block;\n    }\n    .wizard-question {\n      font-size: clamp(24px, 3.5vw, 36px);\n      font-weight: 800;\n      letter-spacing: -0.03em;\n      color: var(--ink);\n      line-height: 1.15;\n      margin-bottom: 8px;\n    }\n    .wizard-hint {\n      font-size: 14px; color: var(--ink-3);\n      margin-bottom: 32px;\n    }\n    .wizard-optional {\n      font-size: 14px; font-weight: 400;\n      color: var(--ink-3); letter-spacing: 0;\n      text-transform: none;\n    }\n\n    /* Option tiles */\n    .options-grid {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 10px;\n    }\n    .option-tile {\n      display: flex; align-items: center; gap: 14px;\n      padding: 16px 18px;\n      background: var(--bg);\n      border: 1.5px solid var(--border);\n      border-radius: var(--radius);\n      cursor: pointer;\n      text-align: left;\n      font-family: inherit;\n      transition: border-color 0.12s, background 0.12s, transform 0.12s;\n    }\n    .option-tile:hover { border-color: var(--amber); transform: translateY(-1px); }\n    .option-tile.selected {\n      border-color: var(--amber);\n      background: var(--amber-lt);\n    }\n    .option-icon {\n      width: 38px; height: 38px; flex-shrink: 0;\n      background: var(--bg-card);\n      border: 1px solid var(--border);\n      border-radius: 10px;\n      display: flex; align-items: center; justify-content: center;\n    }\n    .option-tile.selected .option-icon {\n      background: var(--amber); border-color: var(--amber);\n    }\n    .option-tile.selected .option-icon i { color: #fff !important; }\n    .option-label {\n      font-size: 15px; font-weight: 600; color: var(--ink);\n      flex: 1; line-height: 1.3;\n    }\n    .option-check {\n      width: 20px; height: 20px; flex-shrink: 0;\n      border: 1.5px solid var(--border);\n      border-radius: 6px;\n      display: flex; align-items: center; justify-content: center;\n      transition: all 0.12s;\n    }\n    .option-check.checked {\n      background: var(--amber); border-color: var(--amber);\n    }\n\n    /* Wizard footer */\n    .wizard-footer {\n      display: flex; align-items: center; justify-content: space-between;\n      margin-top: 40px; padding-top: 32px;\n      border-top: 1px solid var(--border);\n    }\n    .skip-hint {\n      font-size: 13px; color: var(--ink-3);\n    }\n\n    /* Unit toggle */\n    .unit-toggle {\n      display: inline-flex; align-items: center; gap: 6px;\n      font-size: 12px; font-weight: 600;\n      color: var(--ink-2);\n      border: 1px solid var(--border);\n      padding: 6px 12px; border-radius: 100px;\n      cursor: pointer; background: transparent;\n      font-family: inherit;\n      margin-bottom: 24px;\n      transition: border-color 0.12s;\n    }\n    .unit-toggle:hover { border-color: var(--amber); }\n\n    /* ── RESULTS ── */\n    #results-section {\n      display: none;\n      border-top: 1px solid var(--border);\n    }\n    .results-inner {\n      max-width: 1200px; margin: 0 auto;\n      padding: 64px 32px 80px;\n    }\n    .results-header {\n      display: flex; align-items: flex-end; justify-content: space-between;\n      margin-bottom: 32px; gap: 24px;\n    }\n    .results-h2 {\n      font-size: clamp(28px, 3.5vw, 42px);\n      font-weight: 900; letter-spacing: -0.04em;\n      color: var(--ink); line-height: 1.05;\n    }\n    .results-summary-bar {\n      background: var(--bg-card);\n      border: 1px solid var(--border);\n      border-radius: var(--radius);\n      padding: 14px 18px;\n      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;\n      margin-bottom: 24px;\n    }\n    .summary-chip {\n      font-size: 12px;\n      color: var(--ink-2);\n      background: var(--bg);\n      border: 1px solid var(--border);\n      padding: 4px 10px; border-radius: 100px;\n    }\n    .summary-chip span { color: var(--ink-3); }\n    .sort-bar {\n      display: flex; align-items: center; gap: 8px;\n      margin-bottom: 28px; flex-wrap: wrap;\n    }\n    .sort-btn {\n      font-size: 12px; font-weight: 600;\n      padding: 7px 14px; border-radius: 100px;\n      border: 1.5px solid var(--border);\n      background: transparent; color: var(--ink-2);\n      cursor: pointer; font-family: inherit;\n      transition: all 0.12s;\n    }\n    .sort-btn:hover { border-color: var(--ink-3); }\n    .sort-btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }\n\n    /* Result cards */\n    .results-grid {\n      display: grid;\n      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));\n      gap: 16px;\n      margin-bottom: 40px;\n    }\n    .bottle-card {\n      background: var(--bg-card);\n      border: 1px solid var(--border);\n      border-radius: var(--radius-lg);\n      overflow: hidden;\n      transition: box-shadow 0.2s, transform 0.2s, border-color 0.2s;\n      display: flex; flex-direction: column;\n    }\n    .bottle-card:hover {\n      box-shadow: 0 8px 32px rgba(0,0,0,0.07);\n      transform: translateY(-2px);\n      border-color: #d4cdc7;\n    }\n    .card-img {\n      height: 200px; background: #fff;\n      display: flex; align-items: center; justify-content: center;\n      position: relative; overflow: hidden;\n      border-bottom: 1px solid var(--border);\n    }\n    .card-img img { height: 160px; width: auto; object-fit: contain; }\n    .card-badge {\n      position: absolute; top: 12px; left: 12px;\n      background: var(--amber); color: #fff;\n      font-size: 10px; font-weight: 700;\n      letter-spacing: 0.08em; text-transform: uppercase;\n      padding: 4px 10px; border-radius: 100px;\n    }\n    .card-body { padding: 20px; display:flex; flex-direction:column; flex:1; background: var(--bg); }\n    .card-body-top { flex:1; }\n    .card-brand {\n      font-size: 11px; font-weight: 700;\n      text-transform: uppercase; letter-spacing: 0.1em;\n      color: var(--ink-3); margin-bottom: 4px;\n    }\n    .card-name {\n      font-size: 15px; font-weight: 700;\n      color: var(--ink); line-height: 1.25;\n      margin-bottom: 6px;\n    }\n    .card-meta {\n      font-size: 12px; color: var(--ink-3);\n      margin-bottom: 14px;\n    }\n    .card-price {\n      font-size: 22px; font-weight: 900;\n      letter-spacing: -0.03em; color: var(--ink);\n    }\n    .card-highlights {\n      display: flex; flex-wrap: wrap; gap: 6px;\n      margin-bottom: 16px;\n    }\n    .card-tag {\n      font-size: 11px; font-weight: 500;\n      color: var(--ink-2);\n      background: var(--bg);\n      border: 1px solid var(--border);\n      padding: 4px 9px; border-radius: 6px;\n    }\n    .card-cta {\n      display: flex; align-items: center; justify-content: center; gap: 8px;\n      width: 100%; padding: 12px;\n      background: var(--ink); color: var(--bg);\n      font-family: inherit; font-size: 14px; font-weight: 700;\n      border: none; border-radius: 10px; cursor: pointer;\n      text-decoration: none;\n      transition: background 0.15s;\n    }\n    .card-cta:hover { background: #2E2720; }\n\n    /* ── HOW IT WORKS ── */\n    #how-it-works {\n      border-top: 1px solid var(--border);\n      padding: 100px 32px;\n      background: var(--bg-card);\n    }\n    .section-inner { max-width: 1200px; margin: 0 auto; }\n    .section-eyebrow {\n      display: flex; align-items: center; gap: 12px;\n      margin-bottom: 48px;\n    }\n    .section-eyebrow hr { flex: 1; border: none; border-top: 1px solid var(--border); }\n    .hiw-grid {\n      display: grid;\n      grid-template-columns: repeat(3, 1fr);\n      gap: 0;\n    }\n    .hiw-step {\n      padding: 40px 40px 40px 0;\n      border-right: 1px solid var(--border);\n    }\n    .hiw-step:last-child { border-right: none; padding-right: 0; }\n    .hiw-step:not(:first-child) { padding-left: 40px; }\n    .hiw-num {\n      font-size: 48px; font-weight: 900;\n      letter-spacing: -0.04em;\n      color: var(--border);\n      line-height: 1;\n      margin-bottom: 20px;\n    }\n    .hiw-title {\n      font-size: 20px; font-weight: 800;\n      letter-spacing: -0.02em; color: var(--ink);\n      margin-bottom: 10px;\n    }\n    .hiw-desc {\n      font-size: 14px; color: var(--ink-2);\n      line-height: 1.7;\n    }\n\n    /* ── CATALOG ── */\n    #catalog {\n      border-top: 1px solid var(--border);\n      padding: 100px 32px;\n    }\n    .catalog-section-header {\n      display: flex; align-items: flex-end;\n      justify-content: space-between;\n      margin-bottom: 32px; gap: 24px;\n    }\n    .catalog-h2 {\n      font-size: clamp(28px, 3vw, 40px);\n      font-weight: 900; letter-spacing: -0.04em;\n      line-height: 1.05;\n    }\n    .catalog-grid {\n      display: grid;\n      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));\n      gap: 1px;\n      border: 1px solid var(--border);\n      border-radius: var(--radius);\n      overflow: hidden;\n      background: var(--border);\n      margin-bottom: 40px;\n    }\n    .catalog-item {\n      background: var(--bg-card);\n      padding: 16px 18px;\n    }\n    .catalog-item-name {\n      font-size: 13px; font-weight: 700;\n      color: var(--ink); margin-bottom: 3px;\n    }\n    .catalog-item-sub {\n      font-size: 11px; color: var(--ink-3);\n    }\n\n    /* ── FAQ ── */\n    #faq {\n      border-top: 1px solid var(--border);\n      padding: 100px 32px;\n      background: var(--bg-card);\n    }\n    .faq-grid {\n      display: grid;\n      grid-template-columns: 320px 1fr;\n      gap: 80px;\n      align-items: start;\n    }\n    .faq-left { position: sticky; top: 96px; }\n    .faq-h2 {\n      font-size: clamp(28px, 3vw, 38px);\n      font-weight: 900; letter-spacing: -0.04em;\n      line-height: 1.1; margin-bottom: 16px;\n \n}\n\nfunction renderStep() {\n  const q = QUESTIONS[currentStep];\n  const total = QUESTIONS.length;\n  const pct = ((currentStep + 1) / total) * 100;\n\n  document.getElementById('progress-bar').style.width = pct + '%';\n\n  const backBtn = document.getElementById('back-btn');\n  backBtn.style.display = currentStep === 0 ? 'none' : 'inline-flex';\n\n  const isLast = currentStep === total - 1;\n  document.getElementById('next-label').textContent = isLast ? 'See My Matches' : 'Next';\n\n  const hasAnswer = q.optional ? true : q.multiSelect ? (answers[q.id]||[]).length>0 : !!answers[q.id];\n  document.getElementById('next-btn').disabled = !hasAnswer;\n  document.getElementById('skip-hint').style.display = q.optional ? 'block' : 'none';\n\n  const unitHtml = q.showUnit ? `\n    <button class=\"unit-toggle\" onclick=\"toggleUnit()\">\n      <i data-lucide=\"arrow-left-right\" style=\"width:12px;height:12px\"><\u002Fi>\n      ${showMl ? 'Switch to oz' : 'Switch to ml'}\n    <\u002Fbutton>` : '';\n\n  const hintHtml = q.hint ? `<p class=\"wizard-hint\">${q.hint}<\u002Fp>` : '<div style=\"height:32px\"><\u002Fdiv>';\n\n  const optionsHtml = q.options.map(opt => {\n    const selected = isOptionSelected(q, opt.value);\n    const label = getLabel(q, opt);\n    const handler = q.multiSelect\n      ? `selectMulti('${q.id}','${opt.value}',this,${!!q.optional})`\n      : `selectSingle('${q.id}','${opt.value}',this)`;\n\n    const checkHtml = q.multiSelect ? `\n      <div data-checkbox class=\"option-check ${selected ? 'checked' : ''}\">\n        ${selected ? '<svg viewBox=\"0 0 24 24\" style=\"width:11px;height:11px;stroke:#fff;stroke-width:3;fill:none\"><polyline points=\"20 6 9 17 4 12\"/><\u002Fsvg>' : ''}\n      <\u002Fdiv>` : '';\n\n    return `<button class=\"option-tile ${selected ? 'selected' : ''}\" onclick=\"${handler}\" data-value=\"${opt.value}\">\n      <div class=\"option-icon\">\n        <i data-lucide=\"${opt.icon}\" style=\"width:16px;height:16px;color:var(--ink-2)\"><\u002Fi>\n      <\u002Fdiv>\n      <span class=\"option-label\">${label}<\u002Fspan>\n      ${checkHtml}\n    <\u002Fbutton>`;\n  }).join('');\n\n  document.getElementById('step-container').innerHTML = `\n    <div class=\"step-anim\">\n      <span class=\"wizard-q-num\">0${currentStep + 1}<\u002Fspan>\n      <h2 class=\"wizard-question\">${q.question}${q.optional ? ` <span class=\"wizard-optional\">(optional)<\u002Fspan>` : ''}<\u002Fh2>\n      ${hintHtml}\n      ${unitHtml}\n      <div class=\"options-grid\">${optionsHtml}<\u002Fdiv>\n    <\u002Fdiv>`;\n  lucide.createIcons();\n}\n\nfunction selectSingle(qId, value, el) {\n  answers[qId] = value;\n  document.querySelectorAll('.option-tile').forEach(t => t.classList.remove('selected'));\n  el.classList.add('selected');\n  el.querySelectorAll('.option-icon i').forEach(i => i.style.color = '#fff');\n  document.getElementById('next-btn').disabled = false;\n  // Re-render to sync icon colors properly\n  setTimeout(() => renderStep(), 0);\n}\n\nfunction selectMulti(qId, value, el, optional) {\n  if (!answers[qId]) answers[qId] = [];\n  const idx = answers[qId].indexOf(value);\n  const nowSelected = idx === -1;\n  if (nowSelected) answers[qId].push(value); else answers[qId].splice(idx, 1);\n  el.classList.toggle('selected', nowSelected);\n  const cb = el.querySelector('[data-checkbox]');\n  if (cb) {\n    cb.className = 'option-check' + (nowSelected ? ' checked' : '');\n    cb.innerHTML = nowSelected ? '<svg viewBox=\"0 0 24 24\" style=\"width:11px;height:11px;stroke:#fff;stroke-width:3;fill:none\"><polyline points=\"20 6 9 17 4 12\"/><\u002Fsvg>' : '';\n  }\n  const icon = el.querySelector('.option-icon i');\n  if (icon) icon.style.color = nowSelected ? '#fff' : 'var(--ink-2)';\n  if (!optional) document.getElementById('next-btn').disabled = answers[qId].length === 0;\n}\n\nfunction toggleUnit() { showMl = !showMl; renderStep(); }\n\nfunction nextStep() {\n  const q = QUESTIONS[currentStep];\n  const hasAnswer = ore -= 35; });\n    const tiers = ['low','mid','high','premium'];\n    const budgetList = Array.isArray(a.budget) ? a.budget : (a.budget ? [a.budget] : []);\n    if (budgetList.length > 0) {\n      if (budgetList.includes(b.priceTier)) score += 20;\n      else {\n        const minDist = Math.min(...budgetList.map(bg => Math.abs(tiers.indexOf(bg) - tiers.indexOf(b.priceTier))));\n        if (minDist === 1) score += 8;\n      }\n    }\n    return { ...b, score };\n  }).sort((a, b) => b.score - a.score);\n}\n\nfunction sortedBottles() {\n  switch (sortMode) {\n    case 'price-asc':  return [...scoredBottles].sort((a,b) => a.price - b.price);\n    case 'price-desc': return [...scoredBottles].sort((a,b) => b.price - a.price);\n    case 'size-asc':   return [...scoredBottles].sort((a,b) => a.oz - b.oz);\n    case 'size-desc':  return [...scoredBottles].sort((a,b) => b.oz - a.oz);\n    default:           return [...scoredBottles];\n  }\n}\n\nfunction setSort(mode) {\n  sortMode = mode;\n  document.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('active', b.dataset.sort === mode));\n  renderResultsGrid();\n}\n\nconst ANSWER_LABELS = {\n  use:      { everyday:'Everyday', gym:'Gym', outdoor:'Hiking', office:'Office', travel:'Travel', kids:'Kids' },\n  size:     { small:'Up to 16 oz', medium:'20–27 oz', large:'28–36 oz', xl:'40+ oz' },\n  temp:     { cold:'Cold', hot:'Hot', both:'Hot & cold', none:'No pref' },\n  material: { steel:'Stainless', plastic:'Plastic', glass:'Glass', any:'Any material' },\n  features: { filter:'Filter', straw:'Straw lid', wide:'Wide mouth', handle:'Handle', light:'Lightweight' },\n  avoid:    { straw:'No straw', handle:'No handle', wide:'No wide mouth', filter:'No filter', plastic:'No plastic', glass:'No glass', insulated:'No insulation', bulky:'No XL' },\n  budget:   { low:'Under $20', mid:'$20–$40', high:'$40–$60', premium:'$60+' },\n};\n\nfunction buildSummaryChips() {\n  return QUESTIONS.map(q => {\n    const val = answers[q.id];\n    if (!val || (Array.isArray(val) && val.length === 0)) return null;\n    const map = ANSWER_LABELS[q.id] || {};\n    const display = Array.isArray(val) ? val.map(v => map[v]||v).join(', ') : (map[val]||val);\n    const shortQ = q.question.replace('?','').replace(/\\(optional\\)/i,'').trim().split(' ').slice(0,2).join(' ');\n    return `<span class=\"summary-chip\"><span>${shortQ}:<\u002Fspan> ${display}<\u002Fspan>`;\n  }).filter(Boolean).join('');\n}\n\nfunction showResults() {\n  trackEvent('wizard_complete', { answers });\n  document.getElementById('wizard-section').style.display = 'none';\n  document.getElementById('results-section').style.display = 'block';\n  const navCta = document.getElementById('nav-cta');\n  navCta.innerHTML = 'Start Over <i data-lucide=\"refresh-cw\" style=\"width:14px;height:14px\"><\u002Fi>';\n  navCta.onclick = resetQuiz;\n  lucide.createIcons();\n\n  sortMode = 'relevance';\n  scoredBottles = scoreBottles();\n\n  document.getElementById('results-summary').innerHTML = `\n    <div class=\"results-summary-bar\">\n      <span class=\"label\" style=\"flex-shrink:0\">Your answers<\u002Fspan>\n      ${buildSummaryChips()}\n      <button onclick=\"editAnswers()\" class=\"btn\" style=\"margin-left:auto;font-size:12px;color:var(--amber);font-weight:600;background:none;border:none;cursor:pointer;padding:0;gap:4px\">\n        <i data-lucide=\"pencil\" style=\"width:12px;height:12px\"><\u002Fi> Edit\n      <\u002Fbutton>\n    <\u002Fdiv>`;\n\n  document.getElementById('results-controls').innerHTML = `\n    <div class=\"sort-bar\">\n      <span class=\"label\">Sort:<\u002Fspan>\n      <button class=\"sort-btn active\" data-sort=\"relevance\"  onclick=\"setSort('relevance')\">Best match<\u002Fbutton>\n      <button class=\"sort-btn\"        data-sort=\"price-asc\"  onclick=\"setSort('price-asc')\">Price ↑<\u002Fbutton>\n      <button class=\"sort-btn\"        data-sort=\"price-desc\" onclick=\"setSort('price-desc')\">Price ↓<\u002Fbutton>\n      <button class=\"sort-btn\"        data-sort=\"size-asc\"   onclick=\"setSort('size-asc')\">Size ↑<\u002Fbutton>\n      <button class=\"sort-btn\"        data-sort=\"size-desc\"  onclick=\"setSort('size-desc')\">Size ↓<\u002Fbutton>\n    <\u002Fdiv>`;\n  lucide.createIcons();\n\n  renderResultsGrid();\n  window.scrollTo({ top: document.getElementById('results-section').offsetTop - 64 });\n}\n\nfunction editAnswers() {\n  document.getElementById('results-section').style.display = 'none';\n  document.getElementById('wizard-section').style.display = 'block';\n  currentStep = 0; renderStep();\n  window.scrollTo({ top: document.getElementById('wizard-section').offsetTop - 64 });\n}\n\nfunction renderResultsGrid() {\n  const grid = document.getElementById('results-grid');\n  grid.innerHTML = '';\n  const bottles = sortedBottles();\n  bottles.forEach((b, idx) => {\n    const isBest = sortMode === 'relevance' && idx === 0;\n    const materialLabel = b.material === 'steel' ? 'Stainless steel' : b.material === 'plastic' ? 'BPA-free plastic' : 'Glass';\n    const imgUrl = BOTTLE_IMAGES[b.id] || '';\n    const card = document.createElement('div');\n    card.className = 'bottle-card fade-in';\n    card.style.transitionDelay = (idx * 0.035) + 's';\n    card.innerHTML = `\n      <div class=\"card-img\">\n        ${isBest ? '<div class=\"card-badge\">Best Match<\u002Fdiv>' : ''}\n        ${imgUrl ? `<img src=\"${imgUrl}\" alt=\"${b.name}\" onerror=\"this.style.display='none'\">` : ''}\n      <\u002Fdiv>\n      <div class=\"card-body\">\n        <div class=\"card-body-top\">\n          <div class=\"card-brand\">${b.brand}<\u002Fdiv>\n          <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px\">\n            <h3 class=\"card-name\">${b.name}<\u002Fh3>\n            <span class=\"card-price\">$${b.price}<\u002Fspan>\n          <\u002Fdiv>\n          <p class=\"card-meta\">${b.oz} oz · ${materialLabel}<\u002Fp>\n          <div class=\"card-highlights\">\n            ${b.highlight.map(h => `<span class=\"card-tag\">${h}<\u002Fspan>`).join('')}\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <a href=\"${b.url}\" target=\"_blank\" rel=\"noopener\" class=\"card-cta\" onclick=\"trackEvent('bottle_click',{id:'${b.id}',name:'${b.name}'})\">\n          <i data-lucide=\"shopping-bag\" style=\"width:14px;height:14px\"><\u002Fi>\n          Buy on Amazon\n        <\u002Fa>\n      <\u002Fdiv>`;\n    grid.appendChild(card);\n  });\n  lucide.createIcons();\n  setTimeout(() => document.querySelectorAll('#results-grid .fade-in').forEach(el => el.classList.add('visible')), 50);\n}\n\n// ─── SCROLL ANIMATIONS ────────────────────────────────────────────────────\nconst observer = new IntersectionObserver(entries => {\n  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });\n}, { threshold: 0.06 });\n\ndocument.addEventListener('DOMContentLoaded', () => {\n  lucide.createIcons();\n  document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));\n  setTimeout(() => {\n    document.querySelectorAll('.fade-in').forEach(el => {\n      if (el.getBoundingClientRect().top < window.innerHeight) el.classList.add('visible');\n    });\n  }, 50);\n  trackEvent('page_view');\n});\n\n// ─── FEEDBACK ─────────────────────────────────────────────────────────────\nfunction toggleFeedback() {\n  document.getElementById('feedback-panel').classList.toggle('open');\n}\nfunction closeFeedback() {\n  document.getElementById('feedback-panel').classList.remove('open');\n}\nasync function submitFeedback() {\n  const message = document.getElementById('fb-message').value.trim();\n  const email = document.getElementById('fb-email').value.trim();\n  const errEl = document.getElementById('fb-error');\n  if (!message) { errEl.style.display = 'block'; return; }\n  errEl.style.display = 'none';\n  fetch('/api/feedback', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({message,email}) }).catch(()=>{});\n  document.getElementById('fb-form').style.display = 'none';\n  document.getElementById('fb-success').style.display = 'block';\n  setTimeout(() => {\n    closeFeedback();\n    setTimeout(() => {\n      document.getElementById('fb-form').style.display = 'block';\n      document.getElementById('fb-success').style.display = 'none';\n      document.getElementById('fb-message').value = '';\n      document.getElementById('fb-email').value = '';\n    }, 400);\n  }, 2500);\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
